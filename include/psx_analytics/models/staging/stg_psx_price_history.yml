version: 2
models:
  - name: stg_psx_price_history
    description: "Cleaned daily OHLCV price history, one row per symbol per trading day"
    columns:
      - name: symbol
        description: "PSX ticker symbol"
        tests:
          - not_null

      - name: price_date
        description: "Trading date for this OHLCV row"
        tests:
          - not_null

      - name: close
        description: "Closing price"
        tests:
          - not_null

      - name: volume
        description: "Traded volume"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
              config:
                where: "volume is not null"

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - symbol
              - price_date
