version: 2
models:
  - name: stg_psx_daily_snapshot
    description: "Cleaned and typed PSX daily snapshot data"
    columns:
      - name: id
        description: "Primary key from raw table"
        tests:
          - unique
          - not_null

      - name: symbol
        description: "PSX ticker symbol, XD suffix stripped"
        tests:
          - not_null

      - name: fetched_at
        description: "Timestamp the snapshot was taken"
        tests:
          - not_null

      - name: current_price
        description: "Current traded price — nullable for non-trading days"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
              config:
                where: "current_price is not null"

      - name: change_pct
        description: "Daily change percentage"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between -50 and 50"
              config:
                where: "change_pct is not null"

      - name: volume
        description: "Traded volume"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
              config:
                where: "volume is not null"
